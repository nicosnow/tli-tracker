name: Build and audit

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# No job needs write access to the repository.
permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # ci installs exactly what package-lock.json pins and fails if it drifts.
      - name: Install JS dependencies
        run: npm ci
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installer
        run: npx tauri build --ci
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 | Format-List
          Get-FileHash src-tauri/target/release/tli-tracker.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tli-tracker-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # Standalone exe: no install step, just run it (needs the WebView2 runtime,
      # which ships with Windows 10/11).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tli-tracker-windows-portable
          path: src-tauri/target/release/tli-tracker.exe
          if-no-files-found: error
